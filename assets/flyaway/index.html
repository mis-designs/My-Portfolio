<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from '/assets/vendor/three/addons/RoundedBoxGeometry.js';

// minimal merge for indexed geometries (position + normal), so no extra vendor file is needed
function mergeGeometries(gs) {
  let nv = 0, ni = 0; for (const g of gs) { nv += g.attributes.position.count; ni += g.index.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), idx = new Uint32Array(ni); let vo = 0, io = 0;
  for (const g of gs) {
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    const ix = g.index.array; for (let k = 0; k < ix.length; k++) idx[io + k] = ix[k] + vo;
    vo += g.attributes.position.count; io += ix.length; g.dispose();
  }
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(pos, 3)); m.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); m.setIndex(new THREE.BufferAttribute(idx, 1));
  return m;
}

const T = 16;                       // film length, seconds
let dirty = true;                   // a paused frame needs redrawing
let portrait = false;               // phone layout: tall picture, text under the map
let leafClock = 0;                  // leaves fall on their own clock, also before the flight starts
const pitchEl = document.getElementById('pitch');
const BLUE = 0x1766ff;
const SMALL = Math.min(innerWidth, innerHeight) < 420;

/* ---------- helpers ---------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(7);

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.3, 9000);
scene.fog = new THREE.Fog(0xdfe9f6, 150, 1400);

function resize() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight), aspect = w / h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, SMALL ? 1.5 : 2));
  renderer.setSize(w, h);
  portrait = aspect < 1.15;
  camera.aspect = aspect;
  // keep roughly the same width of street in view when the frame gets narrower
  camera.fov = aspect >= 1.7 ? 35 : Math.min(66, 2 * Math.atan(Math.tan(17.5 * Math.PI / 180) * (16 / 9) / aspect * 0.9) * 180 / Math.PI);
  camera.updateProjectionMatrix(); dirty = true;
}
addEventListener('resize', resize); resize();

/* ---------- sky ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(6000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = clamp(normalize(vP).y, 0.0, 1.0); vec3 c = mix(vec3(0.87,0.92,0.97), vec3(0.36,0.60,0.95), pow(h, 0.55)); gl_FragColor = vec4(c,1.0); }'
  })
);
scene.add(sky);

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xfff0da, 3.3);
const sunDir = new THREE.Vector3(-0.55, 0.78, 0.5).normalize();
sun.position.copy(sunDir).multiplyScalar(1800);
sun.castShadow = true;
sun.shadow.mapSize.set(SMALL ? 2048 : 4096, SMALL ? 2048 : 4096);
sun.shadow.camera.near = 200; sun.shadow.camera.far = 4000;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xcfe2ff, 0xf1ede6, 1.0));
{ // image-based light from the actual sky + sun, so glass and metal reflect daylight
  const es = new THREE.Scene(); es.add(sky.clone());
  const disc = new THREE.Mesh(new THREE.SphereGeometry(300, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(30, 27, 22) }));
  disc.position.copy(sunDir).multiplyScalar(5000); es.add(disc);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(es, 0.02, 1, 7000).texture;
  scene.environmentIntensity = 0.3;
}

/* ---------- "real -> white model" material patch ---------- */
const uWhite = { value: 0 };
function patch(mat, { windows = false, tiles = false, road = false, tint = false, white = 0.96 } = {}) {
  mat.customProgramCacheKey = () => `patch:${windows}:${tiles}:${road}:${tint}:${white}`;   // each variant needs its own shader program
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uWhite = uWhite;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWp; varying vec3 vWn;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 wp4 = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wp4 = instanceMatrix * wp4;
        #endif
        vWp = (modelMatrix * wp4).xyz; vWn = normal;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uWhite; varying vec3 vWp; varying vec3 vWn;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 realC = diffuseColor.rgb;
        ${windows ? `
        float side = step(abs(vWn.y), 0.5);
        float hx = abs(vWn.x) > 0.5 ? vWp.z : vWp.x;
        vec2 cell = vec2(hx / 3.1, (vWp.y - 0.3) / 3.5);
        vec2 g = fract(cell);
        float rnd = fract(sin(dot(floor(cell), vec2(12.9898, 78.233))) * 43758.5453);
        float win = step(0.14, g.x) * step(g.x, 0.86) * step(0.24, g.y) * step(g.y, 0.84);
        float shop = step(vWp.y, 4.3) * step(0.06, g.x) * step(g.x, 0.94) * step(0.6, vWp.y);   // street-level glazing
        win = max(win * step(4.3, vWp.y), shop) * side;
        float fw = fwidth(cell.x) + fwidth(cell.y);
        win *= 1.0 - smoothstep(0.25, 0.7, fw);
        vec3 glassC = mix(vec3(0.09, 0.13, 0.19), vec3(0.50, 0.66, 0.86), 0.15 + 0.6 * rnd * rnd);
        glassC = mix(glassC, vec3(1.0, 0.86, 0.62), step(0.93, rnd) * 0.8);                     // a few lit rooms
        realC = mix(realC, glassC, win * 0.92);
        realC *= 1.0 - 0.1 * side * step(g.y, 0.07) * (1.0 - smoothstep(0.25, 0.7, fw));       // floor-slab line
        realC *= mix(1.0, 0.82, step(0.5, vWn.y));` : ''}
        ${tiles ? `
        vec2 tg = abs(fract(vWp.xz / 1.6) - 0.5);
        float joint = smoothstep(0.47, 0.49, max(tg.x, tg.y)) * step(0.5, vWn.y);
        joint *= 1.0 - smoothstep(0.1, 0.5, fwidth(vWp.x / 1.6) + fwidth(vWp.z / 1.6));
        realC *= 1.0 - 0.16 * joint;` : ''}
        ${road ? `
        float dx = abs(mod(vWp.x + 40.0, 80.0) - 40.0), dz = abs(mod(vWp.z + 22.0, 80.0) - 40.0);
        float ns = step(dx, 0.16) * step(13.0, dz) * step(0.45, fract(vWp.z / 7.0));
        float ew = step(dz, 0.16) * step(13.0, dx) * step(0.45, fract(vWp.x / 7.0));
        float edge = step(abs(dx - 8.3), 0.1) * step(9.2, dz) + step(abs(dz - 8.3), 0.1) * step(9.2, dx);
        float lm = max(max(ns, ew), edge) * (1.0 - smoothstep(0.2, 0.9, fwidth(vWp.x) + fwidth(vWp.z)));
        realC = mix(realC, vec3(0.86), lm * 0.85);` : ''}
        diffuseColor.rgb = mix(realC, ${tint ? 'mix(vec3(1.0, 0.36, 0.02), vec3(0.82, 0.07, 0.02), smoothstep(-10.0, 10.0, vWp.x - vWp.z * 0.7))' : `vec3(${white.toFixed(3)})`}, uWhite);`);
  };
  return mat;
}

/* ---------- ground, pads, buildings ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000),
  patch(new THREE.MeshStandardMaterial({ color: 0x4d5158, roughness: 0.9 }), { road: true, white: 0.86 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const P = 80, BLOCK = 62;           // grid pitch and block size (road = 18)
const pads = [], bldgs = [], trees = [];
const palette = [0xe9e2d6, 0xf2efe9, 0xd9d3c8, 0xcfd6de, 0xe6d8c2, 0xdcdfe3, 0xc9b8a2, 0xf5f3ee];

for (let i = -10; i <= 9; i++) for (let j = -8; j <= 8; j++) {
  const x0 = 9 + i * P, z1 = 9 + j * P, z0 = z1 - BLOCK;     // pad spans x0..x0+62, z0..z1
  pads.push([x0 + BLOCK / 2, (z0 + z1) / 2, BLOCK, BLOCK]);
  const nx = rand() < 0.5 ? 2 : 3, nz = rand() < 0.5 ? 2 : 3, m = 6;
  const cw = (BLOCK - 2 * m) / nx, cd = (BLOCK - 2 * m) / nz;
  for (let a = 0; a < nx; a++) for (let b = 0; b < nz; b++) {
    const cx = x0 + m + cw * (a + 0.5), cz = z0 + m + cd * (b + 0.5);
    if (rand() < 0.1) { for (let k = 0; k < 1; k++) trees.push([cx + (rand() - .5) * cw * .6, cz + (rand() - .5) * cd * .6, 1 + rand() * .4]); continue; }
    if (j === 0 && Math.abs(cx) < 30 && cz > -16) continue;   // keep the agency's forecourt clear
    const w = cw - 2 - rand() * 3, d = cd - 2 - rand() * 3;
    let h = 9 + Math.pow(rand(), 2) * 36; if (rand() < 0.07) h = 50 + rand() * 35;
    bldgs.push([cx, cz, w, h, d, palette[Math.floor(rand() * palette.length)]]);
  }
}
// merge the two blocks either side of the agency into one, with a backdrop building behind it
pads.push([0, -22, 18.2, BLOCK]);
bldgs.push([0, -34, 26, 30, 30, 0xf2efe9]);

const box = new THREE.BoxGeometry(1, 1, 1); box.translate(0, 0.5, 0);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), C = new THREE.Color();

const padMesh = new THREE.InstancedMesh(box, patch(new THREE.MeshStandardMaterial({ color: 0xcfccc6, roughness: 0.8 }), { tiles: true, white: 0.97 }), pads.length);
pads.forEach(([x, z, w, d], k) => padMesh.setMatrixAt(k, M.compose(new THREE.Vector3(x, 0, z), Q, new THREE.Vector3(w, 0.3, d))));
padMesh.receiveShadow = true; scene.add(padMesh);

const bMesh = new THREE.InstancedMesh(box, patch(new THREE.MeshStandardMaterial({ roughness: 0.82 }), { windows: true, white: 0.975 }), bldgs.length);
bldgs.forEach(([x, z, w, h, d, c], k) => { bMesh.setMatrixAt(k, M.compose(new THREE.Vector3(x, 0.3, z), Q, new THREE.Vector3(w, h, d))); bMesh.setColorAt(k, C.set(c)); });
bMesh.castShadow = bMesh.receiveShadow = true; scene.add(bMesh);

// street trees along the avenue and the agency's street
const streetStart = trees.length;
for (let j = 1; j <= 6; j++) for (let z = 9 + j * P - BLOCK + 5; z < 9 + j * P - 3; z += 10.5) { trees.push([-12, z, 1], [12, z, 1]); }
for (let i = -4; i <= 3; i++) for (let x = 9 + i * P + 5; x < 9 + i * P + BLOCK - 3; x += 10.5) { trees.push([x, 30, 1]); if (Math.abs(x) > 24) trees.push([x, 6, 1]); }

      vec3 cc = mix(vec3(0.83, 0.88, 0.95), vec3(1.0), smoothstep(0.25, 0.7, d));

      gl_FragColor = vec4((cc * cl + vec3(0.02, 0.04, 0.08) * vig * (1.0 - cl)) / max(a, 0.0001), a);
    }`
}));
oScene.add(veil);

/* ---------- the film: everything is a pure function of t ---------- */
const target = new THREE.Vector3();
let pulseClock = 0, loopFade = 0, endRise = 0;   // endRise: final climb into the clouds before the loop
function frame(t) {
  const u = clamp(t / T, 0, 1);

  // one continuous move: slow pull-back, then accelerate back and up while pitching down
  const y = 1.65 + 900 * Math.pow(ss(0.12, 1, u), 2.2) + 520 * endRise;
  const z = 23.5 + 8.5 * ss(0, 0.3, u) + 160 * ss(0.12, 0.55, u) - 140 * ss(0.55, 1, u);
  const side = 150 * ss(0.72, 1, u), sx = portrait ? 0 : side, sz = portrait ? side : 0;   // wide: map slides left for the text · tall: map slides up
  camera.position.set(sx, y, z + sz);
  target.set(sx, 3.7 * (1 - ss(0.1, 0.5, u)), 40 * ss(0.7, 1, u) + sz);
  camera.lookAt(target);
  camera.near = Math.max(0.3, y * 0.04); camera.updateProjectionMatrix();

  // real architecture -> all-white model; the shop grows slightly so it reads on the map
  agency.scale.setScalar(1 + 0.8 * ss(0.45, 0.8, u));
  uWhite.value = ss(0.3, 0.6, u);
  scene.fog.near = 150 + y * 2; scene.fog.far = 1400 + y * 7;
  scene.fog.color.setRGB(lerp(0.87, 0.93, uWhite.value), lerp(0.92, 0.95, uWhite.value), lerp(0.97, 0.98, uWhite.value));

  // shadows follow the framing so they stay crisp near the ground and cover the map up high
  const ext = 70 + y * 0.95, sc = sun.shadow.camera;
  sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.updateProjectionMatrix();
  sun.target.position.set(sx, 0, 20); sun.position.copy(sun.target.position).addScaledVector(sunDir, 1800);
  sun.shadow.normalBias = 0.05 + ext * 0.002;

  // route draws itself toward the agency
  const w = 0.7 + y * 0.0062;
  route.userData.set(w); routeGlow.userData.set(w * 2.6);
  const drawn = Math.floor(ss(0.3, 0.6, u) * (pts.length - 1)) * 6;
  route.geometry.setDrawRange(0, drawn); routeGlow.geometry.setDrawRange(0, drawn);

  // marker lands after the clouds part
  const k = ss(0.74, 0.88, u), back = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
  marker.visible = k > 0; marker.scale.setScalar(Math.max(0.001, 14 * back * k / Math.max(k, 0.001) * (k > 0 ? 1 : 0)));
  pulses.forEach((p, n) => { const ph = (((t + pulseClock) / 2.4) + n * 0.5) % 1; p.scale.setScalar(1 + ph * 2.6); p.material.opacity = 0.42 * (1 - ph) * k; });

  updateLeaves(leafClock, 1 - uWhite.value);

  // clouds: fill the frame on the way through, then part
  const part = ss(0.72, 0.96, u);
  for (const s of clouds) {
    const d = s.userData, r = lerp(d.r0, 185 + d.r0 * 0.27, part);
    s.position.set(sx * 0.4 + Math.cos(d.a) * r, d.y, 60 + Math.sin(d.a) * r);
    s.material.opacity = d.o * (1 - 0.35 * part) * (1 - part * (1 - ss(190, 330, r)));
  }
  uVeil.value = Math.max(loopFade, ss(290, 400, y) * (1 - ss(430, 600, y)));
  uFlow.value = clamp((y - 280) / 330, 0, 1.3) + pulseClock * 0.3;

  renderer.clear();
  renderer.render(scene, camera);
  renderer.render(oScene, oCam);
  pitchEl.style.opacity = (ss(13.4, 15, t) * (1 - loopFade)).toFixed(3);
}

/* ---------- capture the street once so the glass reflects its real surroundings ---------- */
{
  frame(0); agency.visible = false;
  const rt = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType });
  const cc = new THREE.CubeCamera(1, 7000, rt); cc.position.set(0, 2.9, 6.5); scene.add(cc);
  cc.update(renderer, scene); agency.visible = true;
  glass.envMap = rt.texture; glass.envMapIntensity = 1.5; glass.needsUpdate = true;
}

/* ---------- sound: autumn wind made in the browser (no audio file), following the flight ---------- */
const sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext, button = document.getElementById('sound');
  let ctx = null, master, wind, windBand, air, airBand, want = true, white = null, lastLeaf = 0;
  try { if (sessionStorage.getItem('md-flyaway-sound') === 'off') want = false; } catch (e) {}
  const audible = () => !!ctx && ctx.state === 'running' && want;
  const label = () => {
    button.setAttribute('aria-pressed', String(audible()));
    button.setAttribute('aria-label', audible() ? "Disattiva l'audio" : "Attiva l'audio");
    button.querySelector('span').textContent = audible() ? 'Audio attivo' : 'Attiva audio';
  };
  const noise = (seconds, brown) => {
    const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate), d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
    return b;
  };
  const build = () => {
    if (ctx || !AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const loopOf = (buffer) => { const n = ctx.createBufferSource(); n.buffer = buffer; n.loop = true; n.start(); return n; };
    white = noise(2, false);
    // low, soft body of the wind
    windBand = ctx.createBiquadFilter(); windBand.type = 'bandpass'; windBand.frequency.value = 320; windBand.Q.value = 0.5;
    wind = ctx.createGain(); wind.gain.value = 0.3;
    loopOf(noise(7, true)).connect(windBand).connect(wind).connect(master);
    // slow gusts so it never sounds like a steady hiss
    const gust = ctx.createOscillator(), gustDepth = ctx.createGain(); gust.frequency.value = 0.11; gustDepth.gain.value = 0.12;
    gust.connect(gustDepth).connect(wind.gain); gust.start();
    // airy layer that swells inside the clouds
    airBand = ctx.createBiquadFilter(); airBand.type = 'bandpass'; airBand.frequency.value = 1800; airBand.Q.value = 0.7;
    air = ctx.createGain(); air.gain.value = 0;
    loopOf(white).connect(airBand).connect(air).connect(master);
    ctx.onstatechange = label;
  };
  const wake = () => { if (!want) return; build(); if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); };
  // browsers only allow sound after a tap or key press, here or on the page around the film
  for (const target of [window, (() => { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } })()]) {
    if (!target) continue;
    try { target.addEventListener('pointerdown', (e) => { if (!button.contains(e.target)) wake(); }, { passive: true }); target.addEventListener('keydown', wake); } catch (e) {}
  }
  button.addEventListener('click', () => {
    want = !audible();
    try { sessionStorage.setItem('md-flyaway-sound', want ? 'on' : 'off'); } catch (e) {}
    if (want) wake(); else if (master) master.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
    label(); setTimeout(label, 250);
  });
  document.addEventListener('visibilitychange', () => { if (ctx && document.hidden && master) master.gain.setTargetAtTime(0, ctx.currentTime, 0.05); });
  const rustle = (level) => {                           // one dry leaf brushing past
    const src = ctx.createBufferSource(), band = ctx.createBiquadFilter(), g = ctx.createGain(), now = ctx.currentTime, len = 0.09 + Math.random() * 0.16;
    src.buffer = white; band.type = 'bandpass'; band.frequency.value = 2600 + Math.random() * 3200; band.Q.value = 1.4;
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(level * (0.03 + Math.random() * 0.05), now + len * 0.35); g.gain.linearRampToValueAtTime(0, now + len);
    src.connect(band).connect(g).connect(master); src.start(now, Math.random() * 1.5, len + 0.05);
  };
  return {
    // active: film is running on screen · alt: 0 street … 1 top of the climb · cloud: 0…1 inside the cloud · leaves: 1 while the street is in colour
    update(active, alt, cloud, leaves) {
      if (!audible()) return;
      const now = ctx.currentTime;
      master.gain.setTargetAtTime(active ? 0.4 : 0, now, active ? 0.5 : 0.4);   // fades out, never cuts
      wind.gain.setTargetAtTime(0.22 + 0.5 * alt, now, 0.4);
      windBand.frequency.setTargetAtTime(280 + 700 * Math.pow(alt, 0.7), now, 0.4);
      air.gain.setTargetAtTime(0.012 + 0.11 * cloud, now, 0.3);
      if (active && leaves > 0.05 && now - lastLeaf > 0.18 && Math.random() < 0.06 * leaves) { lastLeaf = now; rustle(leaves); }
    },
    chime() {                                            // soft two-note bell when the marker lands
      if (!audible()) return;
      [659.25, 987.77].forEach((freq, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), at = ctx.currentTime + i * 0.14;
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.16, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0008, at + 1.6);
        o.connect(g).connect(master); o.start(at); o.stop(at + 1.7);
      });
    },
    label
  };
})();
sound.label();

/* ---------- playback: waits on the storefront (leaves falling) with a play button, then flies and loops ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IDLE_T = 1.6;        // where the camera waits, and where the flight starts from
const IDLE_AUTO = 6;       // seconds of falling leaves before the film starts by itself
const LOOP_T = 1.0;        // each new loop skips most of the slow opening
let t = reduce ? T : IDLE_T, idle = !reduce, playing = false, visible = false, last = performance.now();
let idleTime = 0, ramp = 0, sinceLoop = 9, hold = 0, looped = false, prevT = 0;
const playBig = document.getElementById('playbig'), playRing = document.getElementById('playring');
const fly = (from) => {                                   // start the flight, easing in from a standstill
  t = from; idle = false; playing = true; ramp = 0; hold = 0; pulseClock = 0; looped = false; loopFade = 0; endRise = 0; sinceLoop = 9; prevT = t;
  playBig.classList.add('gone'); last = performance.now();
};
const wait = (seconds) => {                               // back to the storefront with the play button
  t = IDLE_T; idle = true; playing = false; idleTime = IDLE_AUTO - seconds; hold = 0; pulseClock = 0; looped = false; loopFade = 0; endRise = 0;
  playBig.classList.remove('gone'); dirty = true;
};
playBig.onclick = () => fly(reduce && !idle ? LOOP_T : IDLE_T);
document.getElementById('replay').onclick = () => fly(IDLE_T);
const nameInput = document.getElementById('shopname');
nameInput.addEventListener('input', () => {
  setSign(nameInput.value);
  document.getElementById('pitch-to').textContent = nameInput.value.trim() ? 'fino a ' + signName : 'fino alla tua porta';
  wait(1.6);                                              // show the sign while typing, then fly shortly after the last key
});
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameInput.blur(); });
new IntersectionObserver((e) => { visible = e[0].isIntersecting; last = performance.now(); }, { threshold: 0.45 }).observe(renderer.domElement);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
addEventListener('resize', () => { dirty = true; });
function loop() {
  const now = performance.now(), dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;   // one clock only, never negative
  if (visible && !document.hidden) {
    if (idle) {
      leafClock += dt; idleTime += dt;
      playRing.setAttribute('stroke-dashoffset', (100 * (1 - clamp(idleTime / IDLE_AUTO, 0, 1))).toFixed(1));
      if (idleTime >= IDLE_AUTO) fly(IDLE_T);
      frame(t); dirty = false;
    } else if (playing) {
      leafClock += dt; ramp += dt; sinceLoop += dt;   // below: the slow opening runs about 3x faster, so the camera visibly leaves at once
      if (t < T) { t = Math.min(T, t + dt * ss(0, 0.4, ramp) * (1 + 2.6 * (1 - ss(1.2, 5.2, t)))); loopFade = looped ? 1 - ss(0, 1.1, sinceLoop) : 0; }
      else { hold += dt; pulseClock = hold; endRise = ss(3.4, 5.4, hold); loopFade = ss(3.9, 5.2, hold); if (hold > 5.4) { t = LOOP_T; hold = 0; pulseClock = 0; endRise = 0; looped = true; sinceLoop = 0; ramp = 9; } }
      if (prevT < 12.9 && t >= 12.9) sound.chime();
      prevT = t;
      frame(t); dirty = false;
    } else if (dirty) { frame(t); dirty = false; }
  }
  sound.update(visible && !document.hidden && (playing || idle), clamp(camera.position.y / 900, 0, 1) * (1 - loopFade), uVeil.value, (1 - uWhite.value) * (1 - loopFade));
  requestAnimationFrame(loop);
}
if (reduce) playBig.classList.remove('gone');
requestAnimationFrame(loop);
window.flyaway = { seek(v) { t = v; hold = 0; loopFade = 0; endRise = 0; idle = false; playing = false; dirty = true; playBig.classList.add('gone'); }, state() { return { t, idle, playing, idleTime, visible }; } };   // for checking single frames
</script>
